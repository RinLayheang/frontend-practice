<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADT Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px 16px;
            text-align: center;
        }

        th {
            background-color: #1d4e89;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .no-stock {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Welcome to CADT Shop!</h1>

    <h2>Product Catalog</h2>

    <table>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
        </tr>
        <tr>
            <td><img src="images/book.svg" alt="C# Book" width="50"></td>
            <td>C# Book</td>
            <td>$10</td>
            <td>5</td>
            <td>YES</td>
        </tr>
        <tr>
            <td><img src="images/polo.svg" alt="CADT Polo" width="50"></td>
            <td>CADT Polo</td>
            <td>$12</td>
            <td>60</td>
            <td>YES</td>
        </tr>
        <tr>
            <td><img src="images/mouse.svg" alt="CADT Mouse" width="50"></td>
            <td>CADT Mouse</td>
            <td>$100</td>
            <td>3</td>
            <td class="no-stock">NO</td>
        </tr>
    </table>
</body>
</html>
