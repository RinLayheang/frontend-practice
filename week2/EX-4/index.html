<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Internal CSS */
        .job {
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="images/avatar.svg" alt="Profile picture of Rin Layheang">
        <h1>Rin Layheang</h1>
        <p class="job">Front-end Student</p>
        <!-- Inline CSS -->
        <p class="bio" style="font-style: italic;">
            I am learning HTML and CSS, and I enjoy building clean and simple web pages.
        </p>
        <button type="button">Contact</button>
    </div>
</body>
</html>
