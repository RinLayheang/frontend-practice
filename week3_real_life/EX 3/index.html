<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6fb;
      }

      .pricing-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 32px;
        width: 100%;
        max-width: 1000px;
        padding: 32px;
        box-sizing: border-box;
      }

      .pricing-plan {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 28px;
        background: white;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        transition: transform 0.2s;
      }

      .pricing-plan:hover {
        transform: translateY(-8px);
      }

      .pricing-plan:nth-child(1) {
        --plan-color: linear-gradient(45deg, #0f766e, #0e7490);
      }

      .pricing-plan:nth-child(2) {
        --plan-color: linear-gradient(45deg, #1d4ed8, #6d28d9);
      }

      .pricing-plan:nth-child(3) {
        --plan-color: linear-gradient(45deg, #6d28d9, #be185d);
      }

      .plan-title {
        align-self: stretch;
        padding: 28px 16px;
        background: var(--plan-color);
        color: white;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .plan-price {
        padding: 22px 12px 8px;
        color: #1f2937;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }

      .plan-features {
        flex-grow: 1;
        align-self: stretch;
        list-style: none;
        margin: 0 0 24px;
        padding: 0 24px;
        text-align: center;
      }

      .plan-features li {
        padding: 12px 0;
        border-bottom: 1px solid #e5e7eb;
        color: #4b5563;
        font-size: 14px;
      }

      .plan-button {
        padding: 12px 40px;
        background: var(--plan-color);
        color: white;
        border: none;
        border-radius: 30px;
        font-family: inherit;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
      }

      .plan-button:hover {
        filter: brightness(1.15);
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        /* Small screens: stack the plans vertically */
        .pricing-container {
          flex-direction: column;
          max-width: 460px;
          gap: 32px;
          padding: 20px;
        }

        .pricing-plan {
          flex: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
