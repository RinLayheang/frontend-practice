<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Exercise 3</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
        color: white;
        font-family: system-ui, Arial, sans-serif;
        font-weight: bold;
      }

      header,
      main,
      aside,
      footer,
      .item {
        border-radius: 0.5rem;
      }

      header,
      footer {
        padding: 2rem;
      }

      header {
        background: #1e90ff;
        box-shadow: inset 0 -2px 5px 1px #0077ea;
      }

      .content {
        flex-grow: 1;
        display: flex;
        gap: 1rem;
      }

      main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 2rem;
        background: #3cb371;
        box-shadow: inset 0 -2px 5px 1px #2f8d59;
      }

      .items {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 1rem;
      }

      .item {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 7rem;
        height: 6rem;
        background: #2f8d59;
        box-shadow: inset 0 -2px 5px 1px #226741;
      }

      aside {
        width: 11rem;
        padding: 2rem;
        background: #ff6347;
        box-shadow: inset 0 -2px 5px 1px #e02200;
      }

      footer {
        background: #4169e1;
        box-shadow: inset 0 -2px 5px 1px #1d44b8;
      }
    </style>
  </head>
  <body>
    <header>header</header>
    <div class="content">
      <main>
        <div>main</div>
        <div class="items">
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
        </div>
      </main>
      <aside>sidebar</aside>
    </div>
    <footer>footer</footer>
  </body>
</html>
